<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Elo Ratings Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1730"/>
      <stop offset="55%" stop-color="#132444"/>
      <stop offset="100%" stop-color="#1b1230"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fd0ff"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 80H1200M0 160H1200M0 240H1200"/>
      <path d="M690 40V285M821 40V285M952 40V285M1084 40V285"/>
    </g>

    <!-- the real Elo expected-score curve: E = 1 / (1 + 10^(-d/400)) -->
    <path d="M 690.0,253.3 L 695.8,253.1 L 701.7,252.9 L 707.5,252.7 L 713.3,252.5 L 719.2,252.2 L 725.0,251.9 L 730.8,251.5 L 736.7,251.2 L 742.5,250.7 L 748.3,250.3 L 754.2,249.8 L 760.0,249.2 L 765.8,248.6 L 771.7,247.9 L 777.5,247.2 L 783.3,246.3 L 789.2,245.4 L 795.0,244.4 L 800.8,243.3 L 806.7,242.1 L 812.5,240.8 L 818.3,239.4 L 824.2,237.8 L 830.0,236.1 L 835.8,234.2 L 841.7,232.2 L 847.5,230.0 L 853.3,227.7 L 859.2,225.1 L 865.0,222.4 L 870.8,219.4 L 876.7,216.3 L 882.5,213.0 L 888.3,209.4 L 894.2,205.7 L 900.0,201.8 L 905.8,197.7 L 911.7,193.4 L 917.5,188.9 L 923.3,184.4 L 929.2,179.6 L 935.0,174.8 L 940.8,169.9 L 946.7,165.0 L 952.5,160.0 L 958.3,155.0 L 964.2,150.1 L 970.0,145.2 L 975.8,140.4 L 981.7,135.6 L 987.5,131.1 L 993.3,126.6 L 999.2,122.3 L 1005.0,118.2 L 1010.8,114.3 L 1016.7,110.6 L 1022.5,107.0 L 1028.3,103.7 L 1034.2,100.6 L 1040.0,97.6 L 1045.8,94.9 L 1051.7,92.3 L 1057.5,90.0 L 1063.3,87.8 L 1069.2,85.8 L 1075.0,83.9 L 1080.8,82.2 L 1086.7,80.6 L 1092.5,79.2 L 1098.3,77.9 L 1104.2,76.7 L 1110.0,75.6 L 1115.8,74.6 L 1121.7,73.7 L 1127.5,72.8 L 1133.3,72.1 L 1139.2,71.4 L 1145.0,70.8 L 1150.8,70.2 L 1156.7,69.7 L 1162.5,69.3 L 1168.3,68.8 L 1174.2,68.5 L 1180.0,68.1 L 1185.8,67.8 L 1191.7,67.5 L 1197.5,67.3 L 1203.3,67.1 L 1209.2,66.9 L 1215.0,66.7 L 1215,285 L 690,285 Z" fill="url(#fill)"/>
    <path d="M 690.0,253.3 L 695.8,253.1 L 701.7,252.9 L 707.5,252.7 L 713.3,252.5 L 719.2,252.2 L 725.0,251.9 L 730.8,251.5 L 736.7,251.2 L 742.5,250.7 L 748.3,250.3 L 754.2,249.8 L 760.0,249.2 L 765.8,248.6 L 771.7,247.9 L 777.5,247.2 L 783.3,246.3 L 789.2,245.4 L 795.0,244.4 L 800.8,243.3 L 806.7,242.1 L 812.5,240.8 L 818.3,239.4 L 824.2,237.8 L 830.0,236.1 L 835.8,234.2 L 841.7,232.2 L 847.5,230.0 L 853.3,227.7 L 859.2,225.1 L 865.0,222.4 L 870.8,219.4 L 876.7,216.3 L 882.5,213.0 L 888.3,209.4 L 894.2,205.7 L 900.0,201.8 L 905.8,197.7 L 911.7,193.4 L 917.5,188.9 L 923.3,184.4 L 929.2,179.6 L 935.0,174.8 L 940.8,169.9 L 946.7,165.0 L 952.5,160.0 L 958.3,155.0 L 964.2,150.1 L 970.0,145.2 L 975.8,140.4 L 981.7,135.6 L 987.5,131.1 L 993.3,126.6 L 999.2,122.3 L 1005.0,118.2 L 1010.8,114.3 L 1016.7,110.6 L 1022.5,107.0 L 1028.3,103.7 L 1034.2,100.6 L 1040.0,97.6 L 1045.8,94.9 L 1051.7,92.3 L 1057.5,90.0 L 1063.3,87.8 L 1069.2,85.8 L 1075.0,83.9 L 1080.8,82.2 L 1086.7,80.6 L 1092.5,79.2 L 1098.3,77.9 L 1104.2,76.7 L 1110.0,75.6 L 1115.8,74.6 L 1121.7,73.7 L 1127.5,72.8 L 1133.3,72.1 L 1139.2,71.4 L 1145.0,70.8 L 1150.8,70.2 L 1156.7,69.7 L 1162.5,69.3 L 1168.3,68.8 L 1174.2,68.5 L 1180.0,68.1 L 1185.8,67.8 L 1191.7,67.5 L 1197.5,67.3 L 1203.3,67.1 L 1209.2,66.9 L 1215.0,66.7"
          fill="none" stroke="url(#curve)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 50/50 point -->
    <circle cx="952.5" cy="160" r="6" fill="#0d1730" stroke="#fbbf24" stroke-width="3"/>
    <text x="952.5" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#fbbf24" font-weight="600">50%</text>
    <text x="1180" y="303" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa3c8">rating difference &#8594;</text>

    <!-- title block -->
    <text x="70" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#title)" letter-spacing="1">Elo Ratings Engine</text>
    <text x="72" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#93a7c9">Match-by-match team ratings that weigh <tspan fill="#38bdf8">margin</tspan>, <tspan fill="#a78bfa">quality</tspan> and <tspan fill="#fbbf24">recency</tspan>.</text>

    <!-- tier chips -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <rect x="70"  y="200" width="86" height="28" rx="14" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.45"/>
      <text x="113" y="219" text-anchor="middle" fill="#fbbf24">Elite</text>
      <rect x="164" y="200" width="104" height="28" rx="14" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="216" y="219" text-anchor="middle" fill="#c4b5fd">Contender</text>
      <rect x="276" y="200" width="118" height="28" rx="14" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="335" y="219" text-anchor="middle" fill="#7dd3fc">Competitive</text>
      <rect x="402" y="200" width="112" height="28" rx="14" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.40"/>
      <text x="458" y="219" text-anchor="middle" fill="#6ee7b7">Developing</text>
      <rect x="522" y="200" width="112" height="28" rx="14" fill="#94a3b8" fill-opacity="0.14" stroke="#94a3b8" stroke-opacity="0.40"/>
      <text x="578" y="219" text-anchor="middle" fill="#cbd5e1">Rebuilding</text>
    </g>

    <text x="70" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5e7396">E = 1 / (1 + 10^((Rb - Ra) / 400))</text>

    <rect x="0" y="0" width="1200" height="320" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  </g>
</svg>
